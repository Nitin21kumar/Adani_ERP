server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must NEVER be cached — it's what points the browser at the
    # current JS/CSS bundle. Without this, a browser (or an intermediary
    # cache) can keep serving an old index.html after a new version is
    # deployed, so the app keeps running old code until a hard refresh
    # forces revalidation. This was the cause of "shows old data until I
    # refresh" after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-store";
        expires 0;
    }

    # Vite build output filenames are content-hashed (e.g. index-AbC123.js)
    # — a new deploy always produces new filenames, so these are safe to
    # cache aggressively forever; the browser will simply request the new
    # hashed filename once index.html (never cached, see above) changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (Docker Compose network)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
